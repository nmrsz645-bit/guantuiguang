<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巨量引擎授权回调</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f6f7fb;
      color: #1f2937;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }
    p {
      margin: 8px 0 18px;
      color: #4b5563;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    textarea, input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      color: #111827;
      background: #f9fafb;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    button {
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      margin-right: 8px;
    }
    .muted {
      font-size: 13px;
      color: #6b7280;
    }
    .ok {
      color: #047857;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>巨量引擎授权回调</h1>
    <p>授权成功后，巨量引擎会跳转到这个页面。请把下面的完整回调地址或授权码发给自动化程序使用。</p>

    <div class="grid">
      <div>
        <label for="fullUrl">完整回调地址</label>
        <textarea id="fullUrl" readonly></textarea>
      </div>
      <div>
        <label for="authCode">auth_code / code</label>
        <input id="authCode" readonly>
      </div>
      <div>
        <label for="state">state</label>
        <input id="state" readonly>
      </div>
      <div>
        <button id="copyUrl">复制完整地址</button>
        <button id="copyCode">复制授权码</button>
        <span id="status" class="muted">等待授权参数...</span>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const value = (name) => params.get(name) || hashParams.get(name) || "";
    const authCode = value("auth_code") || value("code");
    const state = value("state");

    document.getElementById("fullUrl").value = window.location.href;
    document.getElementById("authCode").value = authCode;
    document.getElementById("state").value = state;

    const status = document.getElementById("status");
    status.textContent = authCode ? "已获取授权码" : "没有检测到授权码，请确认是否从巨量授权页跳转过来。";
    if (authCode) status.className = "ok";

    async function copyText(text) {
      await navigator.clipboard.writeText(text || "");
      status.textContent = "已复制";
      status.className = "ok";
    }

    document.getElementById("copyUrl").addEventListener("click", () => copyText(window.location.href));
    document.getElementById("copyCode").addEventListener("click", () => copyText(authCode));
  </script>
</body>
</html>
